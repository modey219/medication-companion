# Cloudflare Workers configuration for the Medication Companion assistant
# proxy. See README.md for deployment steps.
#
# No secrets live here. The LLM key and the Play Integrity service account are
# set with `wrangler secret put ...` and are never committed.
#
# The provider settings (LLM_PROVIDER, LLM_MODEL, LLM_BASE_URL) deliberately do
# NOT live here: they are set on the Worker itself (dashboard or
# `wrangler secret put`) so a deploy never overwrites them. `keep_vars` is what
# makes that safe - without it a deploy removes every variable the config does
# not mention, which is how the provider settings were lost before.
# TODO(eng): the dashboard still holds them as plain text; move them to secrets
# once the provider and model are settled.

# Must match the Worker name in the Cloudflare dashboard (Workers Builds
# requirement) and the root directory must be this folder. See README.md.
name = "medication-companion"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Keep variables set outside this file (dashboard / secrets) across deploys.
keep_vars = true

# Only needed when Play Integrity is enforced. Leave the binding commented out
# for local development and for deployments that run without rate-limit storage;
# the worker then falls back to an in-memory counter (single isolate only).
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<REPLACE_WITH_YOUR_KV_NAMESPACE_ID>"

[vars]
# How long the Worker waits for one provider call (review and answer each get
# this). Holds in the config because it is not sensitive and both passes need it.
REQUEST_TIMEOUT_MS = "45000"
PLAY_INTEGRITY_MODE = "off"
