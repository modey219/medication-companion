# Gradle configuration for the Medication Companion app.
# See AGENTS.md for project rules and docs/DECISIONS.md for the version decisions.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 enables built-in Kotlin by default. We opt out and apply the Kotlin
# Android plugin explicitly (org.jetbrains.kotlin.android) so that the Kotlin,
# KSP, Hilt and Compose-compiler versions stay pinned and predictable.
# TODO(eng): re-evaluate migrating to AGP built-in Kotlin in a later release.
android.builtInKotlin=false

# Kotlin
kotlin.code.style=official
