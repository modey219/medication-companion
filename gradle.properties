# Gradle configuration for the Medication Companion app.
# See AGENTS.md for project rules and docs/DECISIONS.md for the version decisions.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 uses built-in Kotlin (enabled by default), so the Kotlin Android plugin
# is not applied. The Kotlin, KSP, Hilt and Compose-compiler versions stay pinned
# in gradle/libs.versions.toml.

# Kotlin
kotlin.code.style=official
